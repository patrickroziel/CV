name: Verify all public Notes cards
on:
  push:
    branches:
      - fix/notes-all-x-previews-20261019
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-save --package-lock=false
      - run: npm run build
      - name: Inspect all published posts as Twitterbot
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, html.parser, urllib.parse
          origin='https://patrickroziel.com'
          def fetch(url,method='GET',limit=800000):
              headers={'User-Agent':'Twitterbot/1.0','Accept':'text/html,image/avif,image/webp,image/*,*/*'}
              req=urllib.request.Request(url,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=22) as r:
                      return r.status,dict(r.headers),r.read(limit)
              except Exception as e:return 0,{},str(e).encode()
          class Meta(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.tags={}
              def handle_starttag(self,tag,attrs):
                  if tag=='meta':
                      obj=dict(attrs); k=obj.get('name') or obj.get('property')
                      if k: self.tags[k]=obj.get('content','')
          status,headers,b=fetch(origin+'/api/portfolio')
          print('API',status)
          assert status==200
          posts=json.loads(b)['data']['socialPosts'];print('POST_COUNT',len(posts))
          for post in posts:
              id=post['id'];url=origin+'/notes/'+urllib.parse.quote(id,safe='')
              status,h,b=fetch(url)
              m=Meta();m.feed(b.decode('utf-8','replace'))
              image=m.tags.get('twitter:image') or m.tags.get('og:image')
              im_stat,im_head,im_body=fetch(image,limit=1024) if image else (0,{},b'')
              fallback=not bool(post.get('bookCoverUrl') or post.get('featuredEmbed',{}).get('url') if isinstance(post.get('featuredEmbed'),dict) else post.get('bookCoverUrl'))
              print('POST',id,'page',status,'title',bool(m.tags.get('twitter:title')),'image',bool(image),'card',m.tags.get('twitter:card'),'image_status',im_stat,'image_type',im_head.get('Content-Type'),'img_host',urllib.parse.urlsplit(image).hostname if image else '-','fallback_source?',fallback)
              for tag in ('twitter:card','twitter:title','twitter:description','twitter:image','og:image'):
                  assert m.tags.get(tag), f'missing {tag} for {id}'
              assert im_stat in (200,206),f'bad image for {id}: {im_stat} {im_body[:100]}'
              assert im_head.get('Content-Type','').startswith('image/'),f'not image {id}'
          print('ALL_PUBLISHED_CARDS_PASS')
          PY
