name: Validate compact Notes photos
on:
  push:
    branches:
      - fix/compact-cover-fill-notes-images-20261019
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-save --package-lock=false
      - run: npm run build
