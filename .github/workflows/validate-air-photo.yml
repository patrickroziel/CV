name: Validate Air photo
on:
  push:
    branches: [fix/air-user-photo-sky-20261021]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check photograph
        run: |
          curl -fSL --max-time 30 -o /tmp/photo.jpg 'https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=2000&q=90'
          file /tmp/photo.jpg
          test $(wc -c < /tmp/photo.jpg) -gt 10000
