name: Import selected AIR photo
on:
  push:
    paths:
      - .github/workflows/import-air-photo.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/air-selected-sky-photo-20261021
      - name: Download approved generated photo
        run: |
          curl -fLsS --retry 3 'https://at.adobe.com/FKAR8LOVxicJsJz8' -o public/air-sky-selected.png
          file public/air-sky-selected.png
          python3 - <<'PY'
          import struct
          p=open('public/air-sky-selected.png','rb').read(24)
          assert p[:8] == b'\x89PNG\r\n\x1a\n', 'Downloaded asset is not a PNG'
          assert struct.unpack('>II',p[16:24]) == (1672,941), 'Unexpected image dimensions'
          PY
      - name: Commit image to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/air-sky-selected.png
          git commit -m 'Add selected AIR sky photograph' || true
          git push origin HEAD:feature/air-selected-sky-photo-20261021
