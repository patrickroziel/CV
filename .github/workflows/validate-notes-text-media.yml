name: Validate Notes text-block feature
on:
  push:
    branches:
      - feature/scrollable-text-media-notes-20261019
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-save --package-lock=false
      - run: npm run build
