name: Check production Notes Air Work routes
on:
  push:
    branches: [diagnose/x-card-live-20261019]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: Check three universes and historic Notes links
        run: |
          python3 - <<'PY'
          import urllib.request,json
          site='https://patrickroziel.com'
          def get(path):
            req=urllib.request.Request(site+path,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as r:
              return r.status,r.url,r.read(240000).decode('utf-8','replace')
          for path,needle in [('/','Un espace à part'),('/air','Décryptages'),('/work','experience')]:
            status,url,text=get(path)
            print(path,'status',status,'needle',needle in text,'final_url',url)
            assert status==200 and needle.lower() in text.lower()
          status,_,content=get('/api/portfolio');posts=json.loads(content)['data']['socialPosts']
          id=next(p['id'] for p in posts if p.get('universe')!='air')
          status,url,body=get('/notes/'+id)
          print('OLD_NOTE',status,'meta',('twitter:card' in body))
          assert status==200 and 'twitter:card' in body
          status,url,body=get('/notes')
          print('OLD_FEED_REDIRECT',status,url)
          assert status==200 and url.rstrip('/')==site
          print('ALL_THREE_UNIVERSES_PASS')
          PY
