name: Validate Notes Air Work
on:
  push:
    branches: [feature/notes-first-air-work-20261021]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-save --package-lock=false
      - run: npm run build
