name: Confirm versioned Notes previews on production
on:
  push:
    branches: [diagnose/x-card-live-20261019]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check public link preview including share parameter
        run: |
          python3 - <<'PY'
          import urllib.request,json,html.parser,urllib.parse
          origin='https://patrickroziel.com'
          class Meta(html.parser.HTMLParser):
            def __init__(self):super().__init__();self.meta={};self.links={}
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='meta':self.meta[a.get('name') or a.get('property','')]=a.get('content','')
              if tag=='link':self.links[a.get('rel','')]=a.get('href','')
          def request(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Twitterbot/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read(500000)
          stat,b=request(origin+'/api/portfolio')
          posts=json.loads(b)['data']['socialPosts']
          assert posts
          for p in posts:
            id=p['id'];base=origin+'/notes/'+urllib.parse.quote(id,safe='')
            url=base+'?share=share20261019'
            st,content=request(url);parser=Meta();parser.feed(content.decode('utf-8','replace'))
            assert st==200
            assert parser.meta.get('twitter:card')=='summary_large_image'
            assert parser.meta.get('twitter:title')
            assert parser.meta.get('twitter:image')
            assert parser.meta.get('og:url')==url,(id,parser.meta.get('og:url'))
            assert parser.links.get('canonical')==base,(id,parser.links.get('canonical'))
            print('PASS',id,'versioned-og-url',True,'canonical',True)
          print('ALL',len(posts),'SHARE URLS VERIFIED')
          PY
